<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
__PAGE_CSS__
/* halaman video simulasi (dibuat build.py dari episodes/_alat/sim-page.html) */
.links { display: grid; gap: 10px } .links a { display: block; background: var(--surface2); color: var(--ink); text-decoration: none; font-weight: 800; border-radius: 12px; padding: 12px 16px }
.links a span { display: block; font-weight: 600; color: var(--ink2); font-size: 15px }
ul.learn { margin: 0; padding-left: 20px } ul.learn li { margin-bottom: 4px }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">__EYEBROW__</div>
    <h1>__H1__</h1>
    <p class="hint">__HINT__</p>
  </header>
  <section class="card player" aria-label="Pemutar simulasi">
    <div class="stage">
      <canvas id="screen" width="1920" height="1080" aria-label="Animasi simulasi"></canvas>
      <audio id="nar" preload="auto" src="narasi.mp3"></audio>
      <button class="bigplay" id="bigplay" aria-label="Putar"><span>▶ Putar simulasi</span></button>
    </div>
    <div class="bar" id="bar" role="slider" aria-label="Posisi simulasi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><i id="barfill"></i></div>
    <div class="row">
      <button class="primary" id="playbtn">▶ Putar</button>
      <button id="replay">↺ Ulangi bagian ini</button>
      <button id="voice" aria-pressed="true" hidden>🔊 Suara: nyala</button>
      <button id="slow" aria-pressed="false">🐢 Mode lambat</button>
      <span class="hint" id="timelabel">0:00 / 0:00</span>
    </div>
    <div>
      <div class="eyebrow">Bagian</div>
      <div class="chapters" id="chapters"></div>
    </div>
  </section>

  <section class="card" aria-label="Yang dipelajari">
    <h2>Yang kamu pelajari</h2>
    <ul class="learn">__BELAJAR__</ul>
  </section>

  <section class="card" aria-label="Cek pemahaman">
    <h2>Cek pemahaman</h2>
    <p class="hint">Pilih satu jawaban. Kalau salah, kamu dapat petunjuk, lalu coba lagi.</p>
    <div class="quiz" id="quiz"></div>
  </section>

  <section class="card" aria-label="Kemajuan">
    <h2>Kemajuanmu</h2>
    <div class="progress" id="progress"></div>
    <p class="hint" style="margin-top:8px">Kemajuan tersimpan di perangkat ini saja.</p>
  </section>

  <section class="card" aria-label="Halaman latihan">
    <h2>Lanjut berlatih</h2>
    <div class="links">__LINKS__</div>
  </section>
</div>
