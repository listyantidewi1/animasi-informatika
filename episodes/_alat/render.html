<!doctype html>
<html><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>__ENGINE__</script>
<script>
  const TL = __TIMELINE__;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  window.__seek = t => { Kiko.draw(ctx, t, TL); return cv.toDataURL('image/jpeg', 0.92); };
  window.__card = (txt, seg) => { Kiko.draw(ctx, 0.5, { ...TL, beats: [{ id: 'card', seg, scene: 'title', text: txt, start: 0, dur: 3, audio: 3, speech: 0 }] }); return cv.toDataURL('image/jpeg', 0.92); };
  window.__total = TL.total; window.__beats = TL.beats; window.__ready = true;
</script></body></html>
