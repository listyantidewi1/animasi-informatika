<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiAntre · Tiket Saya</title>
  <link rel="stylesheet" href="/gaya.css">
</head>
<body>
  <div class="putus" id="putus" hidden>Koneksi terputus, mencoba lagi…</div>
  <header class="atas">
    <div class="logo">S</div>
    <div><h1>Bengkel Maju Jaya</h1><small id="layanan">Tiket antrean</small></div>
  </header>
  <main>
    <div class="kartu" id="kartu">
      <div class="label">Nomor antreanmu</div>
      <div class="nomor" id="nomor">…</div>
      <div class="status" id="status"></div>
      <div class="angka" id="angka">
        <div><b id="posisi">-</b><span>posisi antrean</span></div>
        <div><b id="tunggu">-</b><span>perkiraan menit</span></div>
      </div>
    </div>
    <p class="redup" id="catatan">Halaman ini berubah sendiri. Kamu boleh menunggu di luar, asal halaman ini tetap terbuka.</p>
    <p class="pesan" id="pesan"></p>
    <a class="tombol" id="baru" href="/" hidden>Ambil nomor baru</a>
  </main>
  <script src="/umum.js"></script>
  <script>
    const kode = new URLSearchParams(location.search).get('kode');
    const $ = (id) => document.getElementById(id);
    let loket = null;

    async function segarkan() {
      try {
        const t = await api('/tiket/' + encodeURIComponent(kode));
        $('nomor').textContent = t.label;
        $('layanan').textContent = t.layanan;
        $('status').className = 'status ' + t.status;
        if (t.status === 'waiting') {
          const depan = t.posisi - 1;
          $('status').textContent = depan ? `Masih ada ${depan} orang di depanmu` : 'Kamu berikutnya!';
        } else if (t.status === 'called' && loket) {
          $('status').textContent = `Giliranmu! Silakan ke ${loket}`;
        } else {
          $('status').textContent = STATUS[t.status];
        }
        $('angka').hidden = t.status !== 'waiting';
        $('posisi').textContent = t.posisi;
        $('tunggu').textContent = t.perkiraan_menit;
      } catch (e) {
        $('kartu').hidden = true; $('catatan').hidden = true;
        $('pesan').textContent = e.message;
        $('baru').hidden = false;
      }
    }

    dengarkan(['antrean', 'panggil'], (jenis, data) => {
      $('putus').hidden = jenis !== 'putus';
      if (jenis === 'putus') return;
      if (jenis === 'panggil' && data.label === $('nomor').textContent) loket = data.loket;
      segarkan();
    });
  </script>
</body>
</html>
