<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiAntre · Ambil Nomor</title>
  <link rel="stylesheet" href="/gaya.css">
</head>
<body>
  <header class="atas">
    <div class="logo">S</div>
    <div><h1>Bengkel Maju Jaya</h1><small>Ambil nomor antrean</small></div>
  </header>
  <main>
    <p class="redup">Pilih layanan yang kamu butuhkan.</p>
    <div id="daftar"></div>
    <p class="pesan" id="pesan"></p>
  </main>
  <script src="/umum.js"></script>
  <script>
    const daftar = document.getElementById('daftar');
    const pesan = document.getElementById('pesan');

    async function muat() {
      const layanan = await api('/layanan');
      for (const l of layanan) {
        const b = el('button', 'tombol layanan');
        b.append(el('span', 'huruf', l.code));
        const teks = el('span', '', l.name);
        teks.append(el('small', '', `± ${l.avg_minutes} menit per pelanggan`));
        b.append(teks);
        b.onclick = () => ambil(l.id, b);
        daftar.append(b);
      }
    }

    async function ambil(id, tombol) {
      pesan.textContent = '';
      try {
        const t = await api('/tiket', { method: 'POST', body: { service_id: id } });
        location.href = '/tiket.html?kode=' + encodeURIComponent(t.code);
      } catch (e) {
        pesan.textContent = e.message;
      }
    }
    muat();
  </script>
</body>
</html>
