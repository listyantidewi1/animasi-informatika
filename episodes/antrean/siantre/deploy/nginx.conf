# Nginx di pintu depan: HTTP dialihkan ke HTTPS, lalu diteruskan ke container app
server {
  listen 80;
  server_name antre.bengkelmajujaya.test;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name antre.bengkelmajujaya.test;
  ssl_certificate     /etc/letsencrypt/live/antre.bengkelmajujaya.test/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/antre.bengkelmajujaya.test/privkey.pem;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}