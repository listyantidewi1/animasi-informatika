# Contoh kode bergaya hasil AI: "buatkan docker compose dan Nginx untuk aplikasi ini"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antrean
      POSTGRES_PASSWORD: bengkel2026
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:bengkel2026@db/antrean
      SESSION_SECRET: majujaya-rahasia-banget
      NODE_ENV: production
    depends_on:
      - db
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx-ai.conf:/etc/nginx/conf.d/default.conf:ro