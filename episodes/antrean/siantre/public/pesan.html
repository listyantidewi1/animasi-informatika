<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiAntre · Pesan Jadwal</title>
  <link rel="stylesheet" href="/gaya.css">
</head>
<body>
  <header class="atas">
    <div class="logo">S</div>
    <div><h1>Bengkel Maju Jaya</h1><small>Pesan jadwal</small></div>
  </header>
  <main>
    <div class="kartu">
      <select id="slot"></select>
      <input id="nama" placeholder="Nama">
      <input id="hp" placeholder="Nomor HP" inputmode="tel">
      <button class="tombol" id="kirim">Pesan</button>
      <p class="pesan" id="pesan"></p>
    </div>
    <div class="kartu" id="hasil" hidden>
      <div class="label">Kode pemesananmu</div>
      <div class="nomor" id="kode"></div>
      <p class="redup">Tunjukkan kode ini saat datang. Petugas akan mengubahnya menjadi nomor antrean.</p>
    </div>
  </main>
  <script src="/umum.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    async function muat() {
      const slot = await api('/slot');
      $('slot').replaceChildren(...slot.map((s) => {
        const waktu = new Date(s.starts_at).toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        const o = el('option', '', `${s.layanan} · ${waktu} · sisa ${s.quota - s.terisi}`);
        o.value = s.id; o.disabled = s.terisi >= s.quota; return o;
      }));
    }
    $('kirim').onclick = async () => {
      $('kirim').disabled = true; $('pesan').textContent = '';
      try {
        const b = await api('/booking', { method: 'POST', body: { slot_id: $('slot').value, name: $('nama').value, phone: $('hp').value } });
        $('kode').textContent = b.code; $('hasil').hidden = false; muat();
      } catch (e) { $('pesan').textContent = e.message; }
      finally { $('kirim').disabled = false; }
    };
    muat();
  </script>
</body>
</html>
