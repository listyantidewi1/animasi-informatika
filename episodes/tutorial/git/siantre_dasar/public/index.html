<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>SiAntre - Bengkel Maju Jaya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bengkel Maju Jaya</h1>
  <p>Buka setiap hari pukul 08.00</p>
  <button id="ambil">Ambil nomor antrean</button>
  <div id="nomor">-</div>
  <script>
    document.getElementById('ambil').onclick = async () => {
      const r = await fetch('/api/ambil', { method: 'POST' });
      const data = await r.json();
      document.getElementById('nomor').textContent = data.nomor;
    };
  </script>
</body>
</html>
