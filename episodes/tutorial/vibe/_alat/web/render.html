<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="kanvas.js"></script>
<script>
const c = document.getElementById('c').getContext('2d');
window.muat = async (srcs) => { await Promise.all(srcs.map(s => new Promise(r => { const im = new Image(); im.onload = () => { K.IMG[s] = im; r(); }; im.onerror = r; im.src = s; }))); await document.fonts.load('800 40px Inter'); await document.fonts.load('500 40px "DejaVu Sans Mono"'); return true; };
window.muatSkrip = (src) => new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = r; document.body.appendChild(s); });
window.gambar = (nama, t, D, a) => { c.save(); c.clearRect(0, 0, 1920, 1080); K.adegan[nama](c, t, D, a || {}); c.restore(); return c.canvas.toDataURL('image/jpeg', 0.93); };
</script></body></html>
